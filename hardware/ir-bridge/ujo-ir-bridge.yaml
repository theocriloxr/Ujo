substitutions:
  name: ujo-ir-bridge
  friendly_name: Ujo IR Bridge

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.4.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Recovery"
    password: !secret recovery_ap_password
captive_portal:

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

remote_receiver:
  pin:
    number: GPIO15
    inverted: true
    mode:
      input: true
      pullup: true
  dump: all
  tolerance: 25%
  filter: 50us
  idle: 10ms
  buffer_size: 2kb

button:
  - platform: template
    name: "Learned command test"
    entity_category: diagnostic
    on_press:
      - logger.log: "Capture and review a remote_receiver code before adding a transmitter action."

binary_sensor:
  - platform: status
    name: "Bridge online"
