[platformio]
default_envs = water

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.4.2
  tzapu/WiFiManager@^2.0.17
  mandulaj/PZEM-004T-v30@^1.2.1
  adafruit/Adafruit BME280 Library@^2.3.0
  adafruit/Adafruit SGP40 Sensor@^1.1.3
  milesburton/DallasTemperature@^4.0.4
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINOJSON_DECODE_UNICODE=1

[env:energy]
build_flags = ${env.build_flags} -DUJO_PROFILE_ENERGY

[env:water]
build_flags = ${env.build_flags} -DUJO_PROFILE_WATER

[env:food]
build_flags = ${env.build_flags} -DUJO_PROFILE_FOOD

[env:presence]
build_flags = ${env.build_flags} -DUJO_PROFILE_PRESENCE
